<!DOCTYPE html>
<html lang="vi" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Đối Soát Kho Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-pass { background-color: #def7ec; color: #03543f; border: 1px solid #31c48d; }
        .badge-fail { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f98080; }
        .badge-warn { background-color: #fef08a; color: #713f12; border: 1px solid #facc15; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
    <header class="bg-blue-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-yellow-400"></i> HỆ THỐNG ĐỐI SOÁT KHO ONLINE
                </h1>
                <p class="text-xs text-blue-200 mt-0.5">Đồng bộ trực tiếp qua GitHub API (Không bị dính cache)</p>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span id="statMisa" class="bg-blue-950 px-3 py-1.5 rounded-lg border border-blue-700">MISA: <b class="text-yellow-300">0</b> mã</span>
                <span id="statSv" class="bg-blue-950 px-3 py-1.5 rounded-lg border border-blue-700">SV: <b class="text-yellow-300">0</b> mã</span>
                <button onclick="forceSyncFromGitHub()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-1.5 rounded-lg transition shadow">
                    <i class="fa-solid fa-rotate"></i> Cập Nhật Lại Dữ Liệu Mới
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-5 space-y-4">
        <!-- Khung trạng thái & Nạp nhanh dự phòng -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-3 border-b border-slate-100">
                <div>
                    <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-signal text-blue-600"></i> Trạng thái hệ thống
                    </h2>
                    <span id="syncStatus" class="inline-block mt-1 text-xs text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded font-medium">
                        Đang khởi tạo...
                    </span>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="text-slate-500 font-semibold">Hoặc chọn file tại máy:</span>
                    <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded shadow">
                        <i class="fa-solid fa-file-excel"></i> Chọn MISA
                        <input type="file" id="localMisa" accept=".xlsx,.xls" class="hidden">
